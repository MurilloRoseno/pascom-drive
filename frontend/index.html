<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Paróquia São Rafael - Celebrações, eventos e galeria de fotos." />
    <meta name="robots" content="index, follow" />
    <link rel="preload" as="image" href="/assets/hero-igreja-sao-rafael.avif" type="image/avif" fetchpriority="high" />
    <title>Paróquia São Rafael - Açailândia</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Lato:wght@300;400;700;900&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        var ua = navigator.userAgent || '';
        var coarse = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
        var width = window.innerWidth || 1024;
        var tablet = /iPad|Tablet|PlayBook|Silk|Kindle/i.test(ua) || (coarse && width >= 600 && width < 1024);
        var mobile = /Android|iPhone|iPod|IEMobile|Opera Mini|Mobile/i.test(ua) || width < 768;
        document.documentElement.dataset.platform = tablet ? 'tablet' : mobile ? 'mobile' : 'desktop';
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
